<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shipment Trail — CargoDoc</title>
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/favicon-32.png" sizes="32x32">
<link rel="icon" type="image/png" href="assets/favicon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header class="app-header">
    <div class="brand"><a href="/app.html" style="text-decoration:none;color:inherit;"><img src="assets/logo-cargodoc.webp" alt="CargoDoc" style="height:20px;vertical-align:middle;"></a> / Shipment Trail</div>
    <div class="user-info">
      <span id="user-name"></span>
      <a href="/app.html" class="btn btn-secondary btn-sm">Dashboard</a>
      <button class="btn btn-secondary btn-sm" onclick="logout()">Logout</button>
    </div>
  </header>

  <main class="app-main">

    <div style="margin-bottom:16px;">
      <h2 style="margin-bottom:4px;">Shipment Trail</h2>
      <p style="color:var(--text-muted); font-size:14px;">
        Seluruh dokumen yang saling terhubung dalam satu alur pengiriman ini —
        mulai dari Purchase Order sampai Delivery Note.
      </p>
    </div>

    <div id="shipment-container">
      <p style="color:var(--text-muted);">Loading...</p>
    </div>

  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/doc-trail.js"></script>
  <script src="js/shipment.js"></script>
</body>
</html>
