<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — CargoDoc</title>
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/favicon-32.png" sizes="32x32">
<link rel="icon" type="image/png" href="assets/favicon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="login-page">

  <div class="login-card">
    <p style="margin-bottom:14px;"><a href="/index.html" style="color:var(--text-muted); font-size:13px; text-decoration:none;">← Back to home</a></p>
    <div class="login-logo">
      <img src="assets/logo-cargodoc.webp" alt="CargoDoc" style="height:32px; margin-bottom:12px;">
      <h1>CargoDoc</h1>
      <p class="tagline">Export Documents, Simplified.</p>
    </div>

    <div id="login-error" class="alert alert-error" hidden></div>

    <form id="login-form" autocomplete="on" action="javascript:void(0);">
      <label for="email">Email</label>
      <input type="email" id="email" name="email"
             placeholder="anda@perusahaan.com" required autocomplete="email">

      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             placeholder="••••••••" required autocomplete="current-password">

      <button type="submit" id="btn-login" class="btn btn-primary btn-block">
        Masuk
      </button>
    </form>

    <p class="login-footer">
      Ada kendala login? Hubungi administrator.
    </p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notify.js"></script>
</body>
</html>
