<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Invoice Shipping Generator</title>
<link rel="stylesheet" href="css/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="login-page">

  <div class="login-card">
    <p style="margin-bottom:14px;"><a href="/index.html" style="color:var(--text-muted); font-size:13px; text-decoration:none;">← Back to home</a></p>
    <div class="login-logo">
      <div class="logo-box">ISG</div>
      <h1>Invoice Shipping Generator</h1>
      <p class="tagline">Create Shipping Documents, Simply.</p>
    </div>

    <div id="login-error" class="alert alert-error" hidden></div>

    <form id="login-form" autocomplete="on" action="javascript:void(0);">
      <label for="email">Email</label>
      <input type="email" id="email" name="email"
             placeholder="you@company.com" required autocomplete="email">

      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             placeholder="••••••••" required autocomplete="current-password">

      <button type="submit" id="btn-login" class="btn btn-primary btn-block">
        Login
      </button>
    </form>

    <p class="login-footer">
      Login issues? Contact the administrator.
    </p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
