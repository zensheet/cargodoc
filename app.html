<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — CargoDoc</title>
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="assets/favicon-32.png" sizes="32x32">
<link rel="icon" type="image/png" href="assets/favicon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header class="app-header">
    <div class="brand"><img src="assets/logo-cargodoc.webp" alt="CargoDoc" style="height:20px;vertical-align:middle;"></div>
    <div class="user-info">
      <span id="user-name"></span>
      <a href="/admin.html" id="nav-admin-link" class="btn btn-secondary btn-sm" hidden>Admin</a>
      <a href="/master.html" class="btn btn-secondary btn-sm">Master Data</a>
      <a href="/branding.html" class="btn btn-secondary btn-sm">Branding</a>
      <button class="btn btn-secondary btn-sm" onclick="logout()">Logout</button>
    </div>
  </header>

  <main class="app-main">

    <section style="margin-bottom:24px;">
      <h2>Welcome, <span id="welcome-name">...</span> 👋</h2>
      <p style="color:var(--text-muted);">Pilih dokumen yang ingin Anda buat:</p>
    </section>

    <div id="pending-banner" class="alert alert-warning" style="margin-bottom:24px;" hidden>
      ⏳ Your account is pending activation. You can keep creating and saving
      documents, but downloaded PDFs will include a watermark until an
      administrator activates your account.
      <button class="btn btn-primary btn-sm" style="margin-top:8px;" onclick="showActivationModal()">Hubungi Admin</button>
    </div>

    <div id="feature-grid" class="feature-grid">
      <!-- diisi oleh dashboard.js -->
      <p style="color:var(--text-muted);">Loading features...</p>
    </div>

  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
